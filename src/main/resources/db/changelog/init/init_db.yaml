databaseChangeLog:
  - changeSet:
      id: create-plot-table
      author: Kirill
      changes:
        - createTable:
            tableName: plots
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: create-type-work-table
      author: Kirill
      changes:
        - createTable:
            tableName: type_works
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
  - changeSet:
      id: create-subtype-work-table
      author: Kirill
      changes:
        - createTable:
            tableName: subtype_works
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: code
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: unit_metering
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: type_work_id
                  type: bigint
                  constraints:
                    nullable: false
  - changeSet:
      id: create-plan-table
      author: Kirill
      changes:
        - createTable:
            tableName: plans
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plot_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: type_work_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: subtype_work_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: production_name
                  type: varchar(255)
                  defaultOnNull: false
                  defaultValue: ""
                  constraints:
                    nullable: false
              - column:
                  name: volume
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: true
              - column:
                  name: end_date
                  type: date
                  constraints:
                    nullable: true
  - changeSet:
      id: create-work-report-table
      author: Kirill
      changes:
        - createTable:
            tableName: reports
            columns:
              - column: 
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: plan_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: fact
                  type: float
                  constraints:
                    nullable: false
              - column:
                  name: delta
                  type: float
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: who_send
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: machine
                  type: varchar(255)
                  constraints:
                    nullable: true
              - column:
                  name: comment
                  type: text
                  constraints:
                    nullable: true

  - changeSet:
      id: add-fk
      author: Kirill
      changes:
        - addForeignKeyConstraint:
            baseTableName: subtype_works
            baseColumnNames: type_work_id
            constraintName: fk_subtype_works_type_works
            referencedTableName: type_works
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: plans
            baseColumnNames: plot_id
            constraintName: fk_plans_plots
            referencedTableName: plots
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: plans
            baseColumnNames: type_work_id
            constraintName: fk_plans_type_works
            referencedTableName: type_works
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: plans
            baseColumnNames: subtype_work_id
            constraintName: fk_plans_subtype_works
            referencedTableName: subtype_works
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: reports
            baseColumnNames: plan_id
            constraintName: fk_reports_plans
            referencedTableName: plans
            referencedColumnNames: id
